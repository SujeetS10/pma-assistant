<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>PMA Teaching Assistant</title>
  <link rel="stylesheet" href="css/styles.css">
  <!-- KaTeX renders the maths. Pinned version; for an offline/institutional deployment, download these three
       files into frontend/vendor/ and point the tags there. If it cannot load, formulas show as plain LaTeX. -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css">
  <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.js"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/contrib/auto-render.min.js"></script>
  <script defer src="js/ui.js"></script>
  <script defer src="js/render.js"></script>
  <script defer src="js/api.js"></script>
  <script defer src="js/student.js"></script>
  <script defer src="js/admin.js"></script>
  <script defer src="js/app.js"></script>
</head>
<body>
  <div id="app" aria-live="polite"></div>
  <div id="toasts" role="status"></div>
</body>
</html>
